  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --bg: #070812;
      --hud: rgba(14, 16, 30, 0.84);
      --hud-2: rgba(24, 28, 50, 0.88);
      --border: rgba(139, 92, 246, 0.32);
      --amethyst: #8b5cf6;
      --ice: #38bdf8;
      --crimson: #e11d48;
      --silver: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg); color: var(--silver); min-height: 100vh; overflow-x: hidden;
    }
    #aether-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .hud-wrap { position: relative; z-index: 1; max-width: 1380px; margin: 0 auto; padding: 20px 20px 60px; }

    .fantasy-title { font-family: 'Cinzel', serif; letter-spacing: 0.04em; }

    /* Top Character Selector Bar */
    .hud-nav {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;
      background: var(--hud); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 14px; padding: 14px 20px; margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .nav-roster { display: flex; gap: 10px; flex-wrap: wrap; }
    .hero-tab {
      background: var(--hud-2); border: 1px solid rgba(148,163,184,0.18); color: var(--muted);
      padding: 10px 18px; border-radius: 10px; cursor: pointer; transition: 0.22s; text-align: left;
    }
    .hero-tab:hover { border-color: var(--ice); color: #fff; }
    .hero-tab.active {
      border-color: var(--amethyst); color: #fff;
      background: linear-gradient(135deg, rgba(139,92,246,0.28), rgba(56,189,248,0.12));
      box-shadow: 0 0 20px rgba(139,92,246,0.3);
    }
    .hero-tab .ht-name { font-weight: 700; font-size: 14px; display: block; }
    .hero-tab .ht-sub { font-size: 11px; color: var(--ice); }

    .mode-switch { display: flex; gap: 8px; }
    .mode-pill {
      background: var(--hud-2); border: 1px solid var(--border); color: var(--muted);
      padding: 8px 18px; border-radius: 999px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .mode-pill.active { background: var(--ice); color: #070812; border-color: var(--ice); }
    .mode-pill:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Main HUD Split */
    .hud-grid { display: grid; grid-template-columns: 400px 1fr; gap: 20px; align-items: start; }
    @media (max-width: 1024px) { .hud-grid { grid-template-columns: 1fr; } }

    .panel {
      background: var(--hud); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 16px; padding: 20px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.45);
    }

    /* Resonance Ring */
    .resonance-box {
      display: flex; align-items: center; gap: 18px; padding-bottom: 18px;
      border-bottom: 1px solid rgba(148,163,184,0.15); margin-bottom: 18px;
    }
    .ring-wrap { position: relative; width: 88px; height: 88px; flex-shrink: 0; }
    .ring-text {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .ring-score { font-size: 22px; font-weight: 800; color: #fff; line-height: 1; }
    .ring-tier { font-size: 10px; color: var(--ice); text-transform: uppercase; margin-top: 2px; }

    /* Slot Grid */
    .slot-list { display: flex; flex-direction: column; gap: 8px; max-height: 540px; overflow-y: auto; padding-right: 4px; }
    .slot-item {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px; background: var(--hud-2);
      border: 1px solid rgba(148,163,184,0.12); cursor: pointer; transition: 0.18s;
    }
    .slot-item:hover, .slot-item.selected { border-color: var(--ice); background: rgba(56,189,248,0.12); }
    .slot-name { font-size: 13px; font-weight: 600; color: #fff; }
    .slot-sub { font-size: 11px; color: var(--muted); }
    .slot-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
    .sb-high { background: rgba(225,29,72,0.2); color: #fda4af; border: 1px solid rgba(225,29,72,0.4); }
    .sb-med { background: rgba(56,189,248,0.15); color: var(--ice); border: 1px solid rgba(56,189,248,0.35); }
    .sb-rad { background: rgba(139,92,246,0.22); color: #ddd6fe; border: 1px solid rgba(139,92,246,0.45); }

    /* Right Inspector */
    .inspector-section { display: flex; flex-direction: column; gap: 18px; }
    .detail-box {
      background: linear-gradient(145deg, rgba(139,92,246,0.12), var(--hud-2));
      border: 1px solid var(--amethyst); border-radius: 14px; padding: 18px;
    }
    .detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .remove-banner {
      background: rgba(225,29,72,0.16); border-left: 4px solid var(--crimson);
      padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; font-size: 13px;
    }
    .target-banner {
      background: rgba(56,189,248,0.12); border-left: 4px solid var(--ice);
      padding: 10px 14px; border-radius: 8px; font-size: 13px;
    }

    .arcana-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
    .arcana-tile {
      background: var(--hud-2); border: 1px solid rgba(148,163,184,0.14); border-radius: 12px; padding: 12px;
    }
  </style>
</head>

    (function init3D() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !window.THREE) return;
      const canvas = document.getElementById('aether-canvas');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 5;
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const count = 160;
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - 0.5) * 14;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ color: 0x8b5cf6, size: 0.055, transparent: true, opacity: 0.65 });
      const points = new THREE.Points(geo, mat);
      scene.add(points);

      function animate() {
        requestAnimationFrame(animate);
        points.rotation.y += 0.0007;
        points.rotation.x += 0.0003;
        renderer.render(scene, camera);
      }
      animate();
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();

            { prio:"med", name:"Abyssal Bracelet (2)", slot:"Bracelet", score:"75 → 100", syncs:"~2 Syncs", remove:"Freedom [Vaizel]", target:"Chỉ số PvP Bracelet" },
            { prio:"med", name:"Splendent Ebony Dragon Lord Guard (+15 ex+4)", slot:"Off hand", score:"83 → 100", syncs:"~5 Syncs", remove:"Accuracy", target:"Chỉ số PvP Off hand" },
            { prio:"med", name:"Nuakum Breastplate (+15 ex+1)", slot:"Torso", score:"75 → 100", syncs:"~11 Syncs", remove:"HP", target:"Chỉ số PvP Torso" },
            { prio:"rad", name:"Greaves & Earrings (+12)", slot:"Pants / Earring", score:"81 Radiant", syncs:"0", remove:"Không cần xóa", target:"PvP đạt sẵn 81 Radiant" }
          ]
        }
      }
    };

    let state = { hero: "MusangKing", meta: "pve", selectedIdx: 0 };

    function render() {
      document.getElementById("navRoster").innerHTML = Object.values(HEROES).map(h => `
        <button class="hero-tab ${h.name===state.hero?'active':''}" onclick="pickHero('${h.name}')">
          <span class="ht-name">${h.name}</span>
          <span class="ht-sub">${h.cls} · CP ${h.cp}</span>
        </button>`).join("");

      const h = HEROES[state.hero];
      const hasPvp = Boolean(h.pvp);
      const pvpBtn = document.querySelector('[data-meta="pvp"]');
      pvpBtn.disabled = !hasPvp;
      if (!hasPvp && state.meta === "pvp") {
        state.meta = "pve";
        document.querySelector('[data-meta="pve"]').classList.add("active");
        pvpBtn.classList.remove("active");
      }
      const d = h[state.meta] || h.pve;
      const pct = Math.min(100, d.score);
      const dash = 226;
      const offset = dash - (dash * pct) / 100;

      document.getElementById("resonanceBox").innerHTML = `
        <div class="ring-wrap">
          <svg width="88" height="88" viewBox="0 0 88 88">
            <circle cx="44" cy="44" r="36" fill="none" stroke="rgba(148,163,184,0.16)" stroke-width="8"/>
            <circle cx="44" cy="44" r="36" fill="none" stroke="url(#gradHud)" stroke-width="8"
              stroke-dasharray="${dash}" stroke-dashoffset="${offset}" stroke-linecap="round" transform="rotate(-90 44 44)"/>
            <defs><linearGradient id="gradHud" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#38bdf8"/>
            </linearGradient></defs>
          </svg>
          <div class="ring-text"><span class="ring-score">${d.score}</span><span class="ring-tier">${d.tier}</span></div>
        </div>
        <div>
          <div class="fantasy-title" style="font-size:18px;font-weight:700;color:#fff;">${h.name}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">${h.cls} · ${state.meta.toUpperCase()} Meta</div>
          <div style="font-size:12px;color:var(--ice);margin-top:4px;">Tiềm năng: <strong>${d.pot}</strong> · iLvl ${h.ilvl}</div>
        </div>`;

      if (state.selectedIdx >= d.items.length) state.selectedIdx = 0;

      document.getElementById("slotList").innerHTML = d.items.map((it, idx) => `
        <div class="slot-item ${idx===state.selectedIdx?'selected':''}" onclick="pickItem(${idx})">
          <div>
            <div class="slot-name">${it.name}</div>
            <div class="slot-sub">${it.slot} · ${it.score}</div>
          </div>
          <span class="slot-badge ${it.prio==='high'?'sb-high':it.prio==='med'?'sb-med':'sb-rad'}">
            ${it.prio==='high'?'Ưu tiên':it.prio==='med'?'Làm sau':'Radiant'}
          </span>
        </div>`).join("");

      const sel = d.items[state.selectedIdx];
      document.getElementById("inspectorBox").innerHTML = `
        <div class="detail-header">
          <div>
            <div style="font-size:12px;color:var(--ice);text-transform:uppercase;letter-spacing:0.08em;">${sel.slot}</div>
            <h2 class="fantasy-title" style="font-size:22px;color:#fff;margin-top:2px;">${sel.name}</h2>
          </div>
          <span class="slot-badge ${sel.prio==='high'?'sb-high':sel.prio==='med'?'sb-med':'sb-rad'}">${sel.score} (${sel.syncs})</span>
        </div>
        <div class="remove-banner"><strong>Dòng cần xóa / thay:</strong> ${sel.remove}</div>
        <div class="target-banner"><strong>Mục tiêu nên săn:</strong> ${sel.target}</div>`;

      document.getElementById("arcanaRow").innerHTML = h.pve.arcana.map(a => `
        <div class="arcana-tile">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <strong style="font-size:13px;color:#fff;">${a.name}</strong>
            <span class="slot-badge ${a.tag.includes('Enchant')?'sb-high':a.tag==='On meta'?'sb-rad':'sb-med'}">${a.tag}</span>
          </div>
          <div style="font-size:12px;color:var(--muted);">${a.desc}</div>
        </div>`).join("");

      if (window.gsap) {
        gsap.from("#inspectorBox", { opacity: 0, y: 10, duration: 0.25, ease: "power2.out" });
      }
    }

    function pickHero(name) { state.hero = name; state.selectedIdx = 0; render(); }
    function pickItem(idx) { state.selectedIdx = idx; render(); }

    document.querySelectorAll(".mode-pill").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.disabled) return;
        document.querySelectorAll(".mode-pill").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.meta = btn.dataset.meta;
        state.selectedIdx = 0;
        render();
      });
    });

    render();
  </script>
</body>
</html>
