  <style>
    :root {
      --bg: #09090f;
      --surface: #12121c;
      --surface-2: #191927;
      --border: rgba(148, 163, 184, 0.14);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --indigo: #6366f1;
      --violet: #a855f7;
      --cyan: #22d3ee;
      --rose: #f43f5e;
      --rose-bg: rgba(244, 63, 94, 0.14);
      --cyan-bg: rgba(34, 211, 238, 0.12);
      --violet-bg: rgba(168, 85, 247, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 15% 0%, rgba(99, 102, 241, 0.14), transparent 40%),
                  radial-gradient(circle at 85% 10%, rgba(34, 211, 238, 0.1), transparent 35%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .container { max-width: 1360px; margin: 0 auto; padding: 24px 20px 64px; }

    /* Topbar */
    .topbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-badge {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, var(--indigo), var(--cyan));
      display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #fff;
      box-shadow: 0 0 24px rgba(99, 102, 241, 0.4);
    }
    .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .brand p { font-size: 12px; color: var(--muted); }

    /* Meta Toggle */
    .meta-switch {
      display: inline-flex; background: var(--surface); padding: 4px; border-radius: 10px;
      border: 1px solid var(--border); gap: 4px;
    }
    .meta-btn {
      border: none; background: transparent; color: var(--muted); padding: 8px 18px;
      border-radius: 7px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s;
    }
    .meta-btn.active { background: var(--indigo); color: #fff; box-shadow: 0 2px 12px rgba(99, 102, 241, 0.45); }
    .meta-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Roster Cards */
    .roster-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .member-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px 18px; cursor: pointer; transition: all 0.22s ease; position: relative; overflow: hidden;
    }
    .member-card:hover { border-color: rgba(99, 102, 241, 0.5); transform: translateY(-2px); }
    .member-card.active {
      border-color: var(--cyan); background: linear-gradient(145deg, rgba(99, 102, 241, 0.14), var(--surface));
      box-shadow: 0 8px 28px rgba(34, 211, 238, 0.12);
    }
    .member-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .member-name { font-size: 17px; font-weight: 700; }
    .member-class { font-size: 12px; color: var(--cyan); font-weight: 600; }
    .score-pill {
      padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
      background: var(--violet-bg); color: var(--violet); border: 1px solid rgba(168, 85, 247, 0.3);
    }
    .member-stats { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
    .member-stats strong { color: var(--text); }

    /* Hero Summary */
    .hero-bar {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 20px; margin-bottom: 20px;
    }
    .hero-left h2 { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .tag { font-size: 11px; padding: 3px 9px; border-radius: 6px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
    .hero-metrics { display: flex; flex-wrap: wrap; gap: 24px; }
    .metric { display: flex; flex-direction: column; }
    .metric-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .metric-val { font-size: 20px; font-weight: 800; }
    .metric-val.cyan { color: var(--cyan); }
    .metric-val.violet { color: var(--violet); }

    /* Section Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .tab-btn.active { background: var(--surface-2); color: var(--text); border-color: var(--indigo); }

    /* Filter Bar */
    .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
    .search-input {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 8px 14px; border-radius: 9px; font-size: 13px; min-width: 240px; outline: none;
    }
    .search-input:focus { border-color: var(--cyan); }
    .chip {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .chip.active { background: var(--indigo); color: #fff; border-color: var(--indigo); }

    /* Table */
    .table-wrap {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 820px; }
    th {
      text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted); padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2);
    }
    td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    .badge { display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .badge-high { background: var(--rose-bg); color: var(--rose); }
    .badge-med { background: var(--cyan-bg); color: var(--cyan); }
    .badge-rad { background: var(--violet-bg); color: var(--violet); }
    .line-remove { color: var(--rose); font-weight: 600; }
    .line-target { color: var(--cyan); font-size: 12px; }

    /* Cards Grid for Gear / Arcana */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .info-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    }
    .info-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
    .info-card-title { font-weight: 700; font-size: 14px; }
    .lines-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .line-item {
      display: flex; justify-content: space-between; font-size: 12px; padding: 5px 9px;
      border-radius: 6px; background: var(--surface-2);
    }
    .line-item.weak { border-left: 3px solid var(--rose); color: #fda4af; }
    .line-item.best { border-left: 3px solid var(--cyan); }
    .line-item.used { border-left: 3px solid var(--violet); }
  </style>

    let state = { member: "TheAres", meta: "pve", tab: "upgrades", filter: "all", search: "" };

    function renderRoster() {
      const el = document.getElementById("rosterGrid");
      el.innerHTML = Object.values(MEMBERS).map(m => {
        const d = m[state.meta] || m.pve;
        const active = m.name === state.member ? "active" : "";
        return `
          <div class="member-card ${active}" onclick="selectMember('${m.name}')">
            <div class="member-top">
              <div>
                <div class="member-name">${m.name}</div>
                <div class="member-class">${m.cls} · Lv.${m.level} · ${m.rank}</div>
              </div>
              <span class="score-pill mono">${d.score} ${d.tier}</span>
            </div>
            <div class="member-stats">
              <span>CP: <strong>${m.cp}</strong></span>
              <span>iLvl: <strong>${m.ilvl}</strong></span>
              <span>Tiềm năng: <strong>${d.potential}</strong></span>
            </div>
          </div>`;
      }).join("");
    }

    function renderHero() {
      const m = MEMBERS[state.member];
      const hasPvp = Boolean(m.pvp);
      const pvpBtn = document.querySelector('[data-meta="pvp"]');
      pvpBtn.disabled = !hasPvp;
      if (!hasPvp && state.meta === "pvp") {
        state.meta = "pve";
        document.querySelector('[data-meta="pve"]').classList.add("active");
        pvpBtn.classList.remove("active");
      }
      const d = m[state.meta] || m.pve;
      document.getElementById("heroBar").innerHTML = `
        <div class="hero-left">
          <h2>${m.name} <span class="tag">${m.title}</span> <span class="tag">${state.meta.toUpperCase()}</span></h2>
          <p style="font-size:13px; color:var(--muted); margin-top:4px;">Legion FEAR · Zikel (Asia) · <a href="${m.url}" target="_blank" style="color:var(--cyan); text-decoration:none;">Mở trên AION2 Index ↗</a></p>
        </div>
        <div class="hero-metrics">
          <div class="metric"><span class="metric-label">Combat Power</span><span class="metric-val mono">${m.cp}</span></div>
          <div class="metric"><span class="metric-label">Item Level</span><span class="metric-val mono">${m.ilvl}</span></div>
          <div class="metric"><span class="metric-label">Soul Resonance</span><span class="metric-val violet mono">${d.score} (${d.tier})</span></div>
          <div class="metric"><span class="metric-label">Tiềm năng</span><span class="metric-val cyan mono">${d.potential}</span></div>
        </div>`;
    }

    function renderMain() {
      const m = MEMBERS[state.member];
      const d = m[state.meta] || m.pve;
      const filterBar = document.getElementById("filterBar");
      const main = document.getElementById("mainContent");

      if (state.tab === "upgrades") {
        filterBar.style.display = "flex";
        const q = state.search.toLowerCase();
        const rows = d.upgrades.filter(r => {
          const matchFilter = state.filter === "all" || r.prio === state.filter;
          const matchSearch = !q || `${r.name} ${r.slot} ${r.remove} ${r.target}`.toLowerCase().includes(q);
          return matchFilter && matchSearch;
        });
        main.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th><th>Ưu tiên</th><th>Trang bị</th><th>Slot</th><th>Điểm</th><th>Sync</th><th>Dòng CẦN XÓA</th><th>Mục tiêu nên săn</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(r => `
                  <tr>
                    <td class="mono">${r.rank}</td>
                    <td><span class="badge badge-${r.prio}">${r.prio === 'high' ? 'Ưu tiên cao' : r.prio === 'med' ? 'Làm sau' : 'Radiant'}</span></td>
                    <td><strong>${r.name}</strong><div style="font-size:11px;color:var(--muted);">${r.ench}</div></td>
                    <td>${r.slot}</td>
                    <td class="mono">${r.cur} → <strong>${r.pot}</strong></td>
                    <td class="mono">${r.syncs}</td>
                    <td class="${r.prio !== 'rad' ? 'line-remove' : ''}">${r.remove}</td>
                    <td class="line-target">${r.target}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>`;
      } else if (state.tab === "gear") {
        filterBar.style.display = "none";
        const gearList = m.pve.gear;
        main.innerHTML = `<div class="cards-grid">
          ${gearList.map(g => `
            <div class="info-card">
              <div class="info-card-head">
                <div><div class="info-card-title">${g.name}</div><div style="font-size:12px;color:var(--muted);">${g.slot}</div></div>
                <span class="badge ${g.score.includes('Radiant') ? 'badge-rad' : g.score.includes('Dormant') ? 'badge-high' : 'badge-med'}">${g.score}</span>
              </div>
              <div class="lines-list">
                ${g.lines.map(([ln, rt]) => `
                  <div class="line-item ${rt === 'Weak' ? 'weak' : rt === 'Best' ? 'best' : 'used'}">
                    <span>${ln}</span><strong class="mono">${rt}</strong>
                  </div>
                `).join("")}
              </div>
            </div>
          `).join("")}
        </div>`;
      } else {
        filterBar.style.display = "none";
        const arcList = m.pve.arcana;
        main.innerHTML = `<div class="cards-grid">
          ${arcList.map(a => `
            <div class="info-card">
              <div class="info-card-head">
                <div class="info-card-title">${a.name}</div>
                <span class="badge ${a.action.includes('Enchant') ? 'badge-high' : a.action.includes('On meta') ? 'badge-rad' : 'badge-med'}">${a.action}</span>
              </div>
              <div style="font-size:12px;color:var(--cyan);margin-bottom:6px;">${a.count}</div>
              <div style="font-size:13px;color:var(--muted);">${a.skills}</div>
            </div>
          `).join("")}
        </div>`;
      }
      if (window.gsap) {
        gsap.from("#mainContent > *", { opacity: 0, y: 12, duration: 0.3, ease: "power2.out" });
      }
    }

    function selectMember(name) {
      state.member = name;
      renderRoster(); renderHero(); renderMain();
    }

    document.querySelectorAll(".meta-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.disabled) return;
        document.querySelectorAll(".meta-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.meta = btn.dataset.meta;
        renderRoster(); renderHero(); renderMain();
      });
    });

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.tab = btn.dataset.tab;
        renderMain();
      });
    });

    document.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        state.filter = chip.dataset.filter;
        renderMain();
      });
    });

    document.getElementById("searchInput").addEventListener("input", e => {
      state.search = e.target.value;
      renderMain();
    });

    renderRoster(); renderHero(); renderMain();
