name: Update AION 2 Gear Data

on:
  schedule:
    # Tự động cập nhật mỗi 3 tiếng
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install chromium

      - name: Fetch latest data from aion2index.com
        run: python scripts/update_data.py

      - name: Commit and push updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "chore(data): auto-update member stats from aion2index" && git push)
