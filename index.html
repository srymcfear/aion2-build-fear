<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FEΔR — AION 2 Gear &amp; Soul Sync Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --bg: #08090f;
      --panel: #0f111a;
      --panel-2: #161926;
      --panel-3: #1c2030;
      --cyan: #22d3ee;
      --magenta: #ec4899;
      --violet: #8b5cf6;
      --rose: #fb7185;
      --text: #f1f5f9;
      --muted: #8892a6;
      --border: rgba(148, 163, 184, 0.12);
      --border-hi: rgba(34, 211, 238, 0.32);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(ellipse 80% 50% at 60% -10%, rgba(139, 92, 246, 0.11), transparent),
                  radial-gradient(ellipse 60% 40% at 10% 10%, rgba(34, 211, 238, 0.06), transparent),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    .display { font-family: 'Rajdhani', sans-serif; letter-spacing: 0.01em; }

    .layout { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }
    @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

    /* Sidebar */
    .sidebar {
      background: rgba(11, 13, 21, 0.92);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .sys-header { display: flex; align-items: center; gap: 12px; padding: 0 4px 14px; border-bottom: 1px solid var(--border); }
    .legion-mark {
      width: 36px; height: 36px; border-radius: 9px;
      background: linear-gradient(135deg, var(--magenta), var(--violet));
      display: grid; place-items: center; font-family: 'Rajdhani', sans-serif;
      font-weight: 700; font-size: 16px; color: #fff; flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.28);
    }
    .sys-title { font-size: 17px; font-weight: 700; color: #fff; line-height: 1.2; }
    .sys-tag { font-size: 12px; color: var(--muted); }

    .roster-list { display: flex; flex-direction: column; gap: 8px; }
    .cyber-member {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 12px; cursor: pointer; transition: background 0.16s, border-color 0.16s;
    }
    .cyber-member:hover { background: var(--panel); border-color: var(--border); }
    .cyber-member.active {
      background: var(--panel-2);
      border-color: var(--border-hi);
      box-shadow: inset 3px 0 0 var(--cyan);
    }
    .cm-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .cm-name { font-size: 14px; font-weight: 700; color: #fff; }
    .cm-score {
      font-size: 11px; color: var(--cyan); background: rgba(34, 211, 238, 0.1);
      padding: 2px 7px; border-radius: 6px; font-weight: 700;
    }
    .cm-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .cm-bar { height: 3px; background: rgba(255,255,255,0.06); border-radius: 99px; margin-top: 8px; overflow: hidden; }
    .cm-bar-fill { height: 100%; background: linear-gradient(90deg, var(--violet), var(--cyan)); border-radius: 99px; transition: width 0.35s ease; }

    /* Main */
    .main { padding: 24px 28px 64px; max-width: 1280px; width: 100%; display: flex; flex-direction: column; gap: 18px; }
    .top-hud {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 22px;
    }
    .hud-title { font-size: 24px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .neon-pill {
      font-size: 11px; padding: 3px 9px; border-radius: 6px; font-weight: 700;
      background: rgba(236, 72, 153, 0.14); color: var(--magenta); border: 1px solid rgba(236, 72, 153, 0.35);
    }
    .title-pill {
      font-size: 11px; padding: 3px 9px; border-radius: 6px; font-weight: 600;
      background: var(--panel-2); color: #cbd5e1; border: 1px solid var(--border);
    }
    .meta-toggle {
      display: inline-flex; background: var(--bg); padding: 4px; border-radius: 10px;
      border: 1px solid var(--border); gap: 4px;
    }
    .cyber-btn {
      background: transparent; border: none; color: var(--muted); border-radius: 7px;
      padding: 7px 18px; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.18s;
    }
    .cyber-btn:hover { color: #fff; }
    .cyber-btn.active { background: var(--magenta); color: #fff; box-shadow: 0 2px 10px rgba(236,72,153,0.35); }

    /* KPIs Strip */
    .kpi-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    }
    @media (max-width: 780px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    .kpi-box { padding: 14px 18px; border-right: 1px solid var(--border); }
    .kpi-box:last-child { border-right: none; }
    .kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
    .kpi-val { font-size: 20px; font-weight: 700; color: #fff; margin-top: 4px; }
    .kpi-val.cyan { color: var(--cyan); }
    .kpi-val.magenta { color: var(--magenta); }

    /* Controls & Filter Bar */
    .controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .tab-group { display: flex; gap: 6px; flex-wrap: wrap; background: var(--panel); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
    .tab-item {
      background: transparent; border: none; color: var(--muted); border-radius: 7px;
      padding: 7px 15px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.18s;
    }
    .tab-item:hover { color: #fff; }
    .tab-item.active { background: var(--panel-3); color: #fff; box-shadow: inset 0 0 0 1px rgba(34,211,238,0.35); }
    .search-cyber {
      background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 9px;
      padding: 8px 14px; font-size: 13px; min-width: 250px; outline: none; transition: border-color 0.18s;
    }
    .search-cyber:focus { border-color: var(--cyan); }

    .filter-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .chip {
      background: var(--panel); border: 1px solid var(--border); color: var(--muted); border-radius: 999px;
      padding: 5px 14px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.16s;
    }
    .chip:hover { border-color: var(--cyan); color: #fff; }
    .chip.active { background: var(--violet); color: #fff; border-color: var(--violet); }

    /* Cards Grid */
    .matrix-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 14px; }
    @media (max-width: 520px) { .matrix-grid { grid-template-columns: 1fr; } }
    .matrix-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px;
      display: flex; flex-direction: column; gap: 12px; transition: border-color 0.2s;
    }
    .matrix-card:hover { border-color: rgba(148, 163, 184, 0.25); }
    .matrix-card.prio-high { border-left: 3px solid var(--magenta); }
    .matrix-card.prio-rad { border-left: 3px solid var(--violet); }
    .mc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .mc-title { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.3; }
    .mc-slot { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .mc-badge { font-size: 11px; padding: 3px 9px; border-radius: 6px; font-weight: 700; white-space: nowrap; }
    .mc-badge.high { background: rgba(236, 72, 153, 0.14); color: var(--magenta); }
    .mc-badge.med { background: rgba(34, 211, 238, 0.12); color: var(--cyan); }
    .mc-badge.rad { background: rgba(139, 92, 246, 0.16); color: #c4b5fd; }
    .mc-metrics {
      display: flex; justify-content: space-between; font-size: 12px;
      background: var(--panel-2); border-radius: 8px; padding: 8px 12px; color: var(--muted);
    }
    .mc-metrics strong { color: #fff; }

    /* Gear Lines */
    .gear-lines { display: flex; flex-direction: column; gap: 5px; }
    .g-line {
      display: flex; justify-content: space-between; font-size: 12px; padding: 6px 10px;
      background: var(--panel-2); border-radius: 6px;
    }
    .g-line.Weak { border-left: 3px solid var(--rose); color: #fda4af; }
    .g-line.Best { border-left: 3px solid var(--cyan); color: #e0f2fe; }
    .g-line.Good, .g-line.Fine, .g-line.Used { border-left: 3px solid var(--violet); color: #ddd6fe; }

    /* Item & Avatar Icons */
    .avatar-sm {
      width: 36px; height: 36px; border-radius: 8px; object-fit: cover;
      border: 1px solid rgba(148,163,184,0.25); flex-shrink: 0; background: var(--panel-2);
    }
    .avatar-lg {
      width: 56px; height: 56px; border-radius: 12px; object-fit: cover;
      border: 1px solid var(--border-hi); flex-shrink: 0; background: var(--panel-2);
    }
    .item-icon-wrap {
      width: 42px; height: 42px; border-radius: 9px; flex-shrink: 0;
      background: var(--panel-2); border: 1px solid var(--border);
      display: grid; place-items: center; overflow: hidden; padding: 3px;
    }
    .item-icon-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .mc-head-left { display: flex; align-items: center; gap: 11px; min-width: 0; }

    /* Comparison Breakdown (YOUR LINES vs AIM FOR) */
    .cmp-toggle {
      background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); border-radius: 8px;
      padding: 7px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      letter-spacing: 0.05em; transition: 0.16s;
    }
    .cmp-toggle:hover { border-color: var(--cyan); color: #fff; }
    .cmp-body { display: flex; flex-direction: column; gap: 10px; }
    .cmp-body.collapsed { display: none; }
    .cmp-box { background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; }
    .cmp-hdr {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted);
      margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }
    .cmp-aim-pill {
      background: rgba(139, 92, 246, 0.22); color: #ddd6fe; border: 1px solid rgba(139, 92, 246, 0.4);
      padding: 2px 8px; border-radius: 5px; font-weight: 700; font-size: 10px;
    }
    .cmp-row {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 6px 9px; font-size: 12px; margin-bottom: 4px; background: var(--panel); border-radius: 6px;
    }
    .cmp-row:last-child { margin-bottom: 0; }
    .cmp-row.keep { border-left: 3px solid var(--cyan); color: #e2e8f0; }
    .cmp-row.replace { border-left: 3px solid var(--rose); color: #fda4af; background: rgba(244,63,94,0.07); }
    .cmp-row.aim { border-left: 3px solid var(--violet); color: #ede9fe; }
    .cmp-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .cmp-badge-ok {
      width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(34,211,238,0.16); color: var(--cyan); font-size: 11px; font-weight: 700;
    }
    .cmp-badge-num {
      width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(244,63,94,0.24); color: #fda4af; font-size: 11px; font-weight: 700;
    }

    /* Arcana Full Detail */
    .skill-chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .skill-chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px;
      font-size: 12px; color: var(--text);
    }
    .skill-chip.crossed { opacity: 0.55; text-decoration: line-through; border-color: rgba(244,63,94,0.3); color: var(--rose); }
    .skill-ico { width: 18px; height: 18px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
    .roll-note {
      font-size: 12px; color: var(--cyan); background: rgba(34,211,238,0.08);
      border: 1px solid rgba(34,211,238,0.22); border-radius: 7px; padding: 7px 10px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sys-header">
        <div class="legion-mark">F</div>
        <div>
          <div class="sys-title display">FEΔR Roster</div>
          <div class="sys-tag">Zikel · Asia · 6 Thành viên</div>
        </div>
      </div>
      <div class="roster-list" id="rosterList"></div>
      <div class="sys-tag mono" id="syncTime" style="margin-top:auto;padding-top:12px;border-top:1px solid var(--border);font-size:11px;">Sync: Dữ liệu cục bộ</div>
    </aside>

    <main class="main">
      <div class="top-hud" id="topHud"></div>
      <div class="kpi-grid" id="kpiGrid"></div>

      <div class="controls">
        <div class="tab-group" id="tabGroup">
          <button class="tab-item active" data-tab="upgrades">Ưu tiên Sync</button>
          <button class="tab-item" data-tab="gear">Chi tiết Trang bị</button>
          <button class="tab-item" data-tab="arcana">Arcana</button>
        </div>
        <input type="text" class="search-cyber" id="searchInput" placeholder="Tìm món đồ, slot hoặc chỉ số..." />
      </div>

      <div class="filter-chips" id="filterChips">
        <button class="chip active" data-filter="all">Tất cả</button>
        <button class="chip" data-filter="high">Ưu tiên cao</button>
        <button class="chip" data-filter="med">Làm sau</button>
        <button class="chip" data-filter="rad">Đã chuẩn (Radiant)</button>
      </div>

      <div id="contentArea"></div>
    </main>
  </div>

  <script>
    let AVATARS = {
      TheAres: "https://aion2index.com/img/p/2502/704531866706946873?w=320",
      KingDoggo: "https://aion2index.com/img/p/2502/704250391730266827?w=320",
      MusangKing: "https://aion2index.com/img/p/2502/704250391730265653?w=320",
      TEDs: "https://aion2index.com/img/p/2502/704250391730271158?w=320",
      BER: "https://aion2index.com/img/p/2502/704250391730276474?w=320",
      HHeo: "https://aion2index.com/img/p/2502/704250391730344698?w=320"
    };

    let ICONS = {
      "Abyssal Bracelet": "https://aion2index.com/img/g/Icon_ACC_Bracelet_n_02.png",
      "Dark Dragon Lord Guard": "https://aion2index.com/img/g/Icon_Weapon_Guarder_U_005.png",
      "Dark Dragon Lord Necklace": "https://aion2index.com/img/g/Icon_ACC_NL_0035.png",
      "Enraged Kromede Earrings": "https://aion2index.com/img/g/Icon_ACC_ER_0053.png",
      "Enraged Kromede Necklace": "https://aion2index.com/img/g/Icon_ACC_NL_0053.png",
      "Enraged Kromede Ring": "https://aion2index.com/img/g/Icon_ACC_Ring_0053.png",
      "Enraged Kromede Rod": "https://aion2index.com/img/g/Icon_WP_ST_0041_T06.png",
      "Nuakum Boots": "https://aion2index.com/img/g/Icon_Equip_AR_L_Idris_01_Boots.png",
      "Nuakum Breastplate": "https://aion2index.com/img/g/Icon_Equip_AR_L_Idris_01_Torso.png",
      "Nuakum Cloak": "https://aion2index.com/img/g/Icon_Equip_AR_L_Idris_01_Cape.png",
      "Nuakum Gloves": "https://aion2index.com/img/g/Icon_Equip_AR_L_Idris_01_Gloves.png",
      "Nuakum Greaves": "https://aion2index.com/img/g/Icon_Equip_AR_L_Idris_01_Pants.png",
      "Nuakum Guard": "https://aion2index.com/img/g/Icon_Weapon_Guarder_L_012.png",

      "Splendent Dark Dragon Lord Gloves": "https://aion2index.com/img/g/Icon_GM_0060_T06_Gloves.png",
      "Splendent Dark Dragon Lord Necklace": "https://aion2index.com/img/g/Icon_ACC_NL_0035.png",
      "Splendent Dark Dragon Lord Ring": "https://aion2index.com/img/g/Icon_ACC_Ring_0035.png",
      "Splendent Ebony Dragon Lord Bow": "https://aion2index.com/img/g/Icon_WP_BW_0100_T06.png",
      "Splendent Ebony Dragon Lord Gloves": "https://aion2index.com/img/g/Icon_Equip_AR_L_0005_T05_Gloves.png",
      "Splendent Ebony Dragon Lord Greatsword": "https://aion2index.com/img/g/Icon_WP_GS_0100_T06.png",
      "Splendent Ebony Dragon Lord Guard": "https://aion2index.com/img/g/Icon_Weapon_Guarder_U_013.png",
      "Splendent Ebony Dragon Lord Mace": "https://aion2index.com/img/g/Icon_WP_MA_0100_T06.png",
      "Splendent Ebony Dragon Lord Necklace": "https://aion2index.com/img/g/Icon_ACC_NL_0047.png",
      "Splendent Star Dragon Lord Longsword": "https://aion2index.com/img/g/Icon_WP_SW_0036_T05.png",
      "Bell of Magic": "https://aion2index.com/img/g/Icon_Arcana_Card_Bell_u_DefenceSet2.png",
      "Bell of Vigor": "https://aion2index.com/img/g/Icon_Arcana_Card_Bell_u_PveSet2.png",
      "Chalice of Magic": "https://aion2index.com/img/g/Icon_Arcana_Card_Grail_u_DefenceSet2.png",
      "Chalice of Vigor": "https://aion2index.com/img/g/Icon_Arcana_Card_Grail_u_PveSet2.png",
      "Compass of Magic": "https://aion2index.com/img/g/Icon_Arcana_Card_Compass_u_DefenceSet2.png",
      "Compass of Vigor": "https://aion2index.com/img/g/Icon_Arcana_Card_Compass_u_PveSet2.png",
      "Mirror of Magic": "https://aion2index.com/img/g/Icon_Arcana_Card_Mirror_u_DefenceSet2.png",
      "Mirror of Vigor": "https://aion2index.com/img/g/Icon_Arcana_Card_Mirror_u_PveSet2.png",
      "Parchment of Magic": "https://aion2index.com/img/g/Icon_Arcana_Card_Parchment_u_DefenceSet2.png",
      "Parchment of Vigor": "https://aion2index.com/img/g/Icon_Arcana_Card_Parchment_u_PveSet2.png"
    };

    function getIcon(name) {
      if (ICONS[name]) return ICONS[name];
      const clean = name.replace(/\s*\([^)]*\)/g, "").trim();
      if (ICONS[clean]) return ICONS[clean];
      for (const [k, v] of Object.entries(ICONS)) {
        if (clean.includes(k) || k.includes(clean)) return v;
      }
      if (name.includes("Longsword")) return ICONS["Splendent Star Dragon Lord Longsword"];
      if (name.includes("Mace")) return ICONS["Splendent Ebony Dragon Lord Mace"];
      if (name.includes("Guard")) return ICONS["Nuakum Guard"];
      if (name.includes("Ring")) return ICONS["Enraged Kromede Ring"];
      if (name.includes("Necklace")) return ICONS["Enraged Kromede Necklace"];
      if (name.includes("Earrings")) return ICONS["Enraged Kromede Earrings"];
      if (name.includes("Bracelet")) return ICONS["Abyssal Bracelet"];
      if (name.includes("Greaves")) return ICONS["Nuakum Greaves"];
      return "";
    }

    let SKILL_ICONS = {
      "Aerial Snare": "https://aion2index.com/img/g/ICON_GL_SKILL_015.png",
      "Ambush Stance": "https://aion2index.com/img/g/ICON_AS_SKILL_Passive_007.png",
      "Assault Stance": "https://aion2index.com/img/g/ICON_AS_SKILL_Passive_006.png",
      "Attack Preparation|Gladiator": "https://aion2index.com/img/g/ICON_GL_SKILL_Passive_005.png",
      "Attack Preparation|Chanter": "https://aion2index.com/img/g/ICON_CH_SKILL_Passive_005.png",
      "Blessing of Life": "https://aion2index.com/img/g/ICON_CH_SKILL_Passive_001.png",
      "Blood Absorption": "https://aion2index.com/img/g/ICON_GL_SKILL_Passive_003.png",
      "Bolt": "https://aion2index.com/img/g/ICON_CL_SKILL_006.png",
      "Burst Arrow": "https://aion2index.com/img/g/ICON_RA_SKILL_008.png",
      "Concentrated Fire": "https://aion2index.com/img/g/ICON_RA_SKILL_Passive_003.png",
      "Condemnation": "https://aion2index.com/img/g/ICON_CL_SKILL_035.png",
      "Crossguard": "https://aion2index.com/img/g/ICON_CH_SKILL_Passive_002.png",
      "Dark Crush": "https://aion2index.com/img/g/ICON_CH_SKILL_010.png",
      "Deadshot": "https://aion2index.com/img/g/ICON_RA_SKILL_002.png",

                    </div>`;
                  }).join("")}
                  ${u.anySync ? `<div class="cmp-hdr mono" style="margin-top:6px;margin-bottom:0;border-bottom:none;border-top:1px solid rgba(148,163,184,0.12);padding-top:6px;padding-bottom:0;">
                    <span>${u.anySync.split('·').slice(0,2).join('·').trim()}</span>
                    <strong style="color:var(--magenta);">${u.anySync.split('·').pop().trim()}</strong>
                  </div>` : ''}
                </div>` : ''}
              </div>
            </div>`;
          }).join("")}
        </div>`;
      } else if (state.tab === "gear") {
        const list = m.gear.filter(g => !q || `${g.name} ${g.slot} ${g.lines.map(l=>l[0]).join(' ')}`.toLowerCase().includes(q));
        area.innerHTML = `<div class="matrix-grid">
          ${list.map(g => {
            const ico = getIcon(g.name);
            return `
            <div class="matrix-card ${g.score.includes('Radiant')?'prio-rad':g.score.includes('Dormant')?'prio-high':''}">
              <div class="mc-head">
                <div class="mc-head-left">
                  ${ico ? `<div class="item-icon-wrap"><img src="${ico}" alt="${g.name}" loading="lazy" /></div>` : ''}
                  <div><div class="mc-title">${g.name}</div><div class="mc-slot mono">${g.slot}</div></div>
                </div>
                <span class="mc-badge ${g.score.includes('Radiant')?'rad':g.score.includes('Dormant')?'high':'med'}">${g.score}</span>
              </div>
              <div class="gear-lines">
                ${g.lines.map(([ln, rt]) => `
                  <div class="g-line ${rt}">
                    <span>${ln}</span><strong class="mono">${rt}</strong>
                  </div>`).join("")}
              </div>
            </div>`;
          }).join("")}
        </div>`;
      } else {
        const clsName = m.cls.split("·")[0].trim();
        const arc = m.arcana.filter(a => !q || `${a.name} ${a.skills.join(' ')} ${a.best4.map(b=>b[0]).join(' ')}`.toLowerCase().includes(q));
        area.innerHTML = `<div class="matrix-grid">
          ${arc.map(a => {
            const ico = getIcon(a.name);
            return `
            <div class="matrix-card prio-${a.status}">
              <div class="mc-head">
                <div class="mc-head-left">
                  ${ico ? `<div class="item-icon-wrap"><img src="${ico}" alt="${a.name}" loading="lazy" /></div>` : ''}
                  <div>
                    <div class="mc-title">${a.name}</div>
                    <div class="mc-slot mono">${a.count} · Same in PvE &amp; PvP</div>
                  </div>
                </div>
                <span class="mc-badge ${a.status}">${a.tag}</span>
              </div>

              <div class="cmp-box">
                <div class="cmp-hdr mono">
                  <span>SKILLS HIỆN CÓ</span>
                  <span>ROLLED</span>
                </div>
                <div class="skill-chip-list">
                  ${a.skills.map(sk => {
                    const isCrossed = sk.startsWith("~~");
                    const sName = sk.replace(/^~~|~~$/g, "");
                    const sIco = getSkillIcon(sName, clsName);
                    return `<span class="skill-chip ${isCrossed ? 'crossed' : ''}">
                      ${sIco ? `<img class="skill-ico" src="${sIco}" alt="${sName}" loading="lazy" />` : ''}
                      <span>${sName}</span>
                    </span>`;
                  }).join("")}
                </div>
              </div>

              <div class="cmp-box">
                <div class="cmp-hdr mono">
                  <span class="cmp-aim-pill">BEST ${a.best4.length} META</span>
                  <span>TOP ${clsName.toUpperCase()}</span>
                </div>
                ${a.best4.map(([bName, bPct, onYours]) => {
                  const bIco = getSkillIcon(bName, clsName);
                  return `<div class="cmp-row ${onYours ? 'keep' : 'replace'}">
                    <span style="display:flex;align-items:center;gap:8px;">
                      ${bIco ? `<img class="skill-ico" src="${bIco}" alt="${bName}" loading="lazy" />` : ''}
                      <span>${bName}</span>
                    </span>
                    <span class="cmp-right mono">
                      <strong>${bPct}</strong>
                      ${onYours
                        ? '<span class="cmp-badge-ok" title="On yours">✓</span>'
                        : '<span class="mc-badge high" style="padding:1px 6px;font-size:10px;">Missing</span>'}
                    </span>
                  </div>`;
                }).join("")}
              </div>

              ${a.rollNote ? `<div class="roll-note mono">${a.rollNote}</div>` : ''}
            </div>`;
          }).join("")}
        </div>`;
      }

      if (window.gsap) {
        gsap.from("#contentArea > div > *", { opacity: 0, y: 10, duration: 0.25, stagger: 0.025, ease: "power2.out" });
      }
    }

    function setMember(n) { state.member = n; render(); }
    function setMeta(m) { state.meta = m; render(); }
    function toggleCmp(btn) {
      const body = btn.nextElementSibling;
      const collapsed = body.classList.toggle("collapsed");
      btn.lastElementChild.textContent = collapsed ? "▼ MỞ RỘNG" : "▲ THU GỌN";
    }

    document.querySelectorAll(".tab-item").forEach(b => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".tab-item").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        state.tab = b.dataset.tab;
        render();
      });
    });

    document.querySelectorAll(".chip").forEach(c => {
      c.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
        c.classList.add("active");
        state.filter = c.dataset.filter;
        render();
      });
    });

    document.getElementById("searchInput").addEventListener("input", e => {
      state.q = e.target.value;
      render();
    });

    async function loadLiveData() {
      try {
        const ts = Date.now();
        const metaRes = await fetch(`./data/meta.json?t=${ts}`, { cache: "no-store" });
        if (!metaRes.ok) return;
        const meta = await metaRes.json();
        if (meta.AVATARS) AVATARS = meta.AVATARS;
        if (meta.ICONS) ICONS = meta.ICONS;
        if (meta.SKILL_ICONS) SKILL_ICONS = meta.SKILL_ICONS;

        const members = meta.members || Object.keys(DB);
        const results = await Promise.all(
          members.map(async name => {
            try {
              const r = await fetch(`./data/${name}.json?t=${ts}`, { cache: "no-store" });
              return r.ok ? [name, await r.json()] : null;
            } catch {
              return null;
            }
          })
        );
        results.forEach(item => {
          if (item) DB[item[0]] = item[1];
        });
        if (meta.updatedAt) {
          document.getElementById("syncTime").textContent = `Auto-Sync: ${meta.updatedAt}`;
        }
        render();
      } catch (e) {
        // Fallback to embedded snapshot when opened locally via file://
      }
    }

    render();
    loadLiveData();
  </script>
</body>
</html>
