<html lang="vi">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --bg: #05050a;
      --panel: #0b0c16;
      --panel-2: #121426;
      --cyan: #22d3ee;
      --magenta: #ec4899;
      --violet: #8b5cf6;
      --rose: #fb7185;
      --text: #e2e8f0;
      --muted: #64748b;
      --border: rgba(34, 211, 238, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Subtle Cyber Grid + Scanline */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: linear-gradient(rgba(34, 211, 238, 0.035) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(236, 72, 153, 0.035) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    .mono { font-family: 'Share Tech Mono', monospace; }
    .display { font-family: 'Orbitron', sans-serif; }

    .layout {
      position: relative; z-index: 1; display: grid; grid-template-columns: 300px 1fr; min-height: 100vh;
    }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }

    /* Left Cyber Rail */
    .sidebar {
      background: linear-gradient(180deg, #090a14 0%, #06060c 100%);
      border-right: 1px solid var(--border);
      padding: 24px 18px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .sys-header {
      border-left: 3px solid var(--magenta); padding-left: 12px;
    }
    .sys-tag { font-size: 11px; color: var(--cyan); letter-spacing: 0.16em; }
    .sys-title { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: 0.05em; }

    .roster-list { display: flex; flex-direction: column; gap: 12px; }
    .cyber-member {
      background: var(--panel);
      border: 1px solid rgba(139, 92, 246, 0.25);
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
      padding: 14px 16px; cursor: pointer; transition: 0.2s;
    }
    .cyber-member:hover { border-color: var(--cyan); transform: translateX(4px); }
    .cyber-member.active {
      border-color: var(--magenta);
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.16), rgba(34, 211, 238, 0.08));
      box-shadow: inset 3px 0 0 var(--magenta);
    }
    .cm-top { display: flex; justify-content: space-between; align-items: center; }
    .cm-name { font-size: 18px; font-weight: 700; color: #fff; }
    .cm-score { font-size: 12px; color: var(--cyan); border: 1px solid var(--cyan); padding: 2px 7px; }
    .cm-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .cm-bar { height: 4px; background: rgba(255,255,255,0.08); margin-top: 10px; overflow: hidden; }
    .cm-bar-fill { height: 100%; background: linear-gradient(90deg, var(--magenta), var(--cyan)); }

    /* Main Workspace */
    .main { padding: 24px 28px 60px; display: flex; flex-direction: column; gap: 20px; }
    .top-hud {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;
      background: var(--panel); border: 1px solid var(--border); padding: 18px 22px;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
    }
    .hud-title { font-size: 26px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 12px; }
    .neon-pill {
      font-size: 11px; padding: 3px 10px; border: 1px solid var(--magenta); color: var(--magenta);
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .meta-toggle { display: flex; gap: 8px; }
    .cyber-btn {
      background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
      padding: 9px 20px; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700;
      cursor: pointer; transition: 0.2s; letter-spacing: 0.08em;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }
    .cyber-btn.active { background: var(--magenta); color: #fff; border-color: var(--magenta); box-shadow: 0 0 18px rgba(236,72,153,0.5); }
    .cyber-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Bento KPIs */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .kpi-box {
      background: var(--panel); border: 1px solid rgba(139, 92, 246, 0.25); padding: 14px 16px;
      position: relative;
    }
    .kpi-box::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, var(--cyan), transparent); }
    .kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
    .kpi-val { font-size: 22px; font-weight: 700; color: #fff; margin-top: 4px; }
    .kpi-val.cyan { color: var(--cyan); }
    .kpi-val.magenta { color: var(--magenta); }

    /* Tabs & Controls */
    .controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .tab-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-item {
      background: transparent; border: 1px solid var(--border); color: var(--cyan);
      padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; text-transform: uppercase;
    }
    .tab-item.active { background: var(--cyan); color: #05050a; }
    .search-cyber {
      background: var(--panel); border: 1px solid var(--border); color: var(--cyan);
      padding: 8px 14px; font-family: 'Share Tech Mono', monospace; font-size: 13px; min-width: 240px; outline: none;
    }

    /* Priority Matrix Cards */
    .matrix-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
    .matrix-card {
      background: var(--panel); border: 1px solid rgba(34, 211, 238, 0.2); padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    }
    .matrix-card.prio-high { border-color: rgba(236, 72, 153, 0.6); box-shadow: inset 0 0 20px rgba(236, 72, 153, 0.06); }
    .matrix-card.prio-rad { border-color: rgba(139, 92, 246, 0.5); }
    .mc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .mc-title { font-size: 16px; font-weight: 700; color: #fff; }
    .mc-slot { font-size: 12px; color: var(--cyan); }
    .mc-badge { font-size: 11px; padding: 2px 8px; font-weight: 700; text-transform: uppercase; }
    .mc-badge.high { background: rgba(236, 72, 153, 0.2); color: var(--magenta); border: 1px solid var(--magenta); }
    .mc-badge.med { background: rgba(34, 211, 238, 0.15); color: var(--cyan); border: 1px solid var(--cyan); }
    .mc-badge.rad { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; border: 1px solid var(--violet); }
    .mc-metrics { display: flex; justify-content: space-between; font-size: 13px; background: var(--panel-2); padding: 8px 10px; }
    .mc-remove { font-size: 13px; color: var(--rose); }
    .mc-target { font-size: 12px; color: #a5f3fc; }
  </style>
</head>

            { prio:"high", name:"Nuakum Pauldrons", slot:"Shoulders (+15 ex+2)", score:"50 → 100", syncs:"~15 Syncs", remove:"Prayer of Concentration, Empyrean Lords' Benediction", target:"Attack (95%), Status Effect Resist (79%), Critical Hit (62%)" },
            { prio:"med", name:"Enraged Kromede Earrings", slot:"Earring (+15)", score:"63 → 88", syncs:"~8 Syncs", remove:"Radiant Benediction", target:"Chỉ số PvP Earring" },
            { prio:"med", name:"Splendent Ebony Dragon Lord Gloves", slot:"Gloves (+15 ex+2)", score:"46 → 96", syncs:"~18 Syncs", remove:"Endurance Penetration, Warm Benediction, Healing Enhancement", target:"Chỉ số PvP Gloves" },
            { prio:"med", name:"Enraged Kromede Ring", slot:"Ring (+15 ex+1)", score:"56 → 81", syncs:"~10 Syncs", remove:"Debilitating Mark", target:"Chỉ số PvP Ring" },
            { prio:"med", name:"Abyssal Bracelet (2)", slot:"Bracelet (+10)", score:"75 → 100", syncs:"~2 Syncs", remove:"Freedom [Vaizel]", target:"Chỉ số PvP Bracelet" },
            { prio:"med", name:"Splendent Ebony Dragon Lord Guard", slot:"Off hand (+15 ex+4)", score:"83 → 100", syncs:"~5 Syncs", remove:"Accuracy", target:"Chỉ số PvP Off hand" },
            { prio:"med", name:"Nuakum Breastplate", slot:"Torso (+15 ex+1)", score:"75 → 100", syncs:"~11 Syncs", remove:"HP", target:"Chỉ số PvP Torso" },
            { prio:"rad", name:"Greaves & Earrings (+12)", slot:"Pants / Earring", score:"81 Radiant", syncs:"0", remove:"Không cần xóa", target:"PvP đạt sẵn 81 Radiant" }
          ]
        }
      }
    };

    let state = { member: "KingDoggo", meta: "pve", tab: "upgrades", q: "" };

    function render() {
      const rosterEl = document.getElementById("rosterList");
      rosterEl.innerHTML = Object.values(DB).map(m => {
        const d = m[state.meta] || m.pve;
        return `
          <div class="cyber-member ${m.name === state.member ? 'active' : ''}" onclick="setMember('${m.name}')">
            <div class="cm-top">
              <span class="cm-name">${m.name}</span>
              <span class="cm-score mono">${d.score} PTS</span>
            </div>
            <div class="cm-sub">${m.cls} · CP ${m.cp}</div>
            <div class="cm-bar"><div class="cm-bar-fill" style="width:${d.score}%"></div></div>
          </div>`;
      }).join("");

      const m = DB[state.member];
      const hasPvp = Boolean(m.pvp);
      if (!hasPvp && state.meta === "pvp") state.meta = "pve";
      const d = m[state.meta] || m.pve;

      document.getElementById("topHud").innerHTML = `
        <div>
          <div class="hud-title display">${m.name} <span class="neon-pill mono">${state.meta.toUpperCase()}</span></div>
          <div class="mono" style="font-size:12px;color:var(--muted);margin-top:4px;">UNIT_CLASS: ${m.cls} // LEGION: FEAR</div>
        </div>
        <div class="meta-toggle">
          <button class="cyber-btn ${state.meta==='pve'?'active':''}" onclick="setMeta('pve')">PVE</button>
          <button class="cyber-btn ${state.meta==='pvp'?'active':''}" ${hasPvp?'':'disabled'} onclick="setMeta('pvp')">PVP</button>
        </div>`;

      document.getElementById("kpiGrid").innerHTML = `
        <div class="kpi-box"><div class="kpi-label mono">COMBAT POWER</div><div class="kpi-val mono">${m.cp}</div></div>
        <div class="kpi-box"><div class="kpi-label mono">ITEM LEVEL</div><div class="kpi-val mono">${m.ilvl}</div></div>
        <div class="kpi-box"><div class="kpi-label mono">SOUL RESONANCE</div><div class="kpi-val magenta mono">${d.score} (${d.tier})</div></div>
        <div class="kpi-box"><div class="kpi-label mono">POTENTIAL REACH</div><div class="kpi-val cyan mono">${d.pot}</div></div>`;

      const grid = document.getElementById("matrixGrid");
      const q = state.q.toLowerCase();

      if (state.tab === "arcana") {
        const arc = m.pve.arcana.filter(a => !q || `${a.name} ${a.info}`.toLowerCase().includes(q));
        grid.innerHTML = arc.map(a => `
          <div class="matrix-card prio-${a.status}">
            <div class="mc-head">
              <div><div class="mc-title">${a.name}</div><div class="mc-slot mono">ARCANA MODULE</div></div>
              <span class="mc-badge ${a.status}">${a.tag}</span>
            </div>
            <div style="font-size:13px;color:var(--text);">${a.info}</div>
          </div>`).join("");
      } else {
        const list = d.upgrades.filter(u => !q || `${u.name} ${u.slot} ${u.remove} ${u.target}`.toLowerCase().includes(q));
        const filtered = state.tab === "gear" ? list : list.filter(u => u.prio !== "rad" || q);
        grid.innerHTML = filtered.map(u => `
          <div class="matrix-card prio-${u.prio}">
            <div class="mc-head">
              <div><div class="mc-title">${u.name}</div><div class="mc-slot mono">${u.slot}</div></div>
              <span class="mc-badge ${u.prio}">${u.prio==='high'?'PRIORITY':u.prio==='med'?'QUEUE':'RADIANT'}</span>
            </div>
            <div class="mc-metrics mono">
              <span>SCORE: <strong>${u.score}</strong></span>
              <span>EST: <strong style="color:var(--cyan)">${u.syncs}</strong></span>
            </div>
            <div class="mc-remove"><strong>[XÓA]:</strong> ${u.remove}</div>
            <div class="mc-target"><strong>[SĂN]:</strong> ${u.target}</div>
          </div>`).join("");
      }

      if (window.gsap) {
        gsap.from(".matrix-card", { opacity: 0, scale: 0.96, duration: 0.25, stagger: 0.03, ease: "power2.out" });
      }
    }

    function setMember(n) { state.member = n; render(); }
    function setMeta(m) { state.meta = m; render(); }

    document.querySelectorAll(".tab-item").forEach(b => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".tab-item").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        state.tab = b.dataset.tab;
        render();
      });
    });
    document.getElementById("searchInput").addEventListener("input", e => { state.q = e.target.value; render(); });

    render();
  </script>
</body>
</html>
